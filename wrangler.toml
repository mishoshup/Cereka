name = "cereka-docs"
compatibility_date = "2026-05-08"

pages_build_output_dir = "docs/book"
pages_build_command = "curl -fsSL https://github.com/rust-lang/mdBook/releases/latest/download/mdbook-v0.4.40-x86_64-unknown-linux-gnu.tar.gz | tar xz && ./mdbook build docs"

[env.production]
routes = [{ pattern = "docs.cereka.dev", custom_domain = true }]
